<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bank of Larp</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body { background:#f4f4f5; }
  body { font-family: 'Archivo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  ::selection { background:#ff2d2d; color:#fff; }
  input:focus, [contenteditable]:focus { outline: none; }
  ::-webkit-scrollbar { display:none; }
  .press:active { transform: scale(0.96); }
  [contenteditable="true"] { cursor: text; }
  [contenteditable="true"]:focus { box-shadow: 0 1px 0 0 #dc2626; }

  /* ---------- SPLASH SCREEN ---------- */
  #splash {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #splash.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .splash-text {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 2rem;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #ffffff 20%, #6b6b6b 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    opacity: 0;
    filter: blur(12px);
    animation: splashAnim 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes splashAnim {
    0%   { opacity: 0; filter: blur(12px); transform: scale(0.95); }
    30%  { opacity: 1; filter: blur(0px);  transform: scale(1); }
    70%  { opacity: 1; filter: blur(0px);  transform: scale(1); }
    100% { opacity: 0; filter: blur(8px);  transform: scale(1.05); }
  }
  .splash-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: #5a5a5a;
    text-align: center;
    margin-top: 0.75rem;
    opacity: 0;
    filter: blur(8px);
    animation: splashAnim 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
</style>
</head>
<body class="min-h-screen">

<!-- ======================= SPLASH / OPENING ======================= -->
<div id="splash">
  <div>
    <p class="splash-text">BANK OF LARP</p>
    <p class="splash-sub">SECURE-LINK ESTABLISHED</p>
  </div>
</div>

<!-- ======================= FAKE PUSH NOTIFICATION ======================= -->
<div id="pushNotif" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-[26rem] bg-[#1a1a1a]/95 backdrop-blur border border-white/10 rounded-2xl px-4 py-3 flex items-center gap-3 shadow-[0_15px_35px_-10px_rgba(0,0,0,0.7)] opacity-0 -translate-y-16 pointer-events-none transition-all duration-500 ease-out">
  <div class="w-9 h-9 rounded-full bg-gradient-to-br from-red-500 via-red-600 to-neutral-900 flex items-center justify-center shrink-0 font-black text-[10px] text-white">
    <span id="pushLogo">BL</span>
  </div>
  <div class="min-w-0 flex-1">
    <p class="text-[12px] font-bold text-white truncate">Bank of Larp</p>
    <p class="text-[11px] text-white/60 truncate mono" id="pushMsg">Nuevo ingreso recibido</p>
  </div>
</div>

<div class="max-w-md mx-auto min-h-screen bg-gray-50 relative pb-32">

  <!-- ======================= WALLET CARD (DARK) ======================= -->
  <div class="bg-[#121212] text-white rounded-b-[3rem] px-6 pt-6 pb-8 relative z-10 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)]">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-8">
      <div class="w-11 h-11 rounded-full bg-gradient-to-br from-red-500 via-red-600 to-neutral-900 border border-white/10 flex items-center justify-center font-black text-sm">
        <span id="logoDisplay"></span>
      </div>
      <p id="userDisplay" class="text-[15px] font-bold tracking-tight cursor-text">Your Wallet</p>
      <div class="flex items-center gap-2">
        <button id="fullscreenBtn" title="Pantalla completa" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white/70 hover:text-white transition-colors">
          <svg id="expandIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4" />
          </svg>
          <svg id="compressIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 4v4H5M15 4v4h4M9 20v-4H5M15 20v-4h4" />
          </svg>
        </button>
        <button id="notifBtn" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white/80 hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
      </div>
    </div>

    <!-- BALANCE ZONE -->
    <div class="flex flex-col items-center text-center mb-7">
      <span class="text-[11px] mono tracking-[0.35em] text-white/40 mb-1">USD</span>
      <div class="flex items-center gap-1.5 mb-2">
        <span class="text-sm text-neutral-400 font-medium">Balance</span>
        <button id="toggleEye" class="text-neutral-500 hover:text-white transition-colors">
          <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <div id="balanceWrap" class="cursor-text w-full flex justify-center">
        <span id="balanceDisplay" class="mono text-[2.75rem] leading-none font-black tracking-tight">$126,300.00</span>
      </div>
    </div>

    <!-- ACTION PILL -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <div class="bg-[#1e1e1e] rounded-full flex items-center gap-1 p-1.5 border border-white/5">
        <button class="press w-11 h-11 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-6 6m6-6l6 6" />
          </svg>
        </button>
        <button class="press w-11 h-11 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m0 0l6-6m-6 6l-6-6" />
          </svg>
        </button>
        <button id="addTxnBtn" title="Simular ingreso" class="press w-11 h-11 rounded-full bg-red-600 flex items-center justify-center hover:bg-red-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>
    </div>

    <!-- STATS ROW -->
    <div class="grid grid-cols-3 gap-2 mb-6">
      <div class="bg-white/5 border border-white/5 rounded-xl p-3 text-center">
        <p class="text-[9px] mono tracking-wider text-white/40 mb-1">APY</p>
        <p id="statApy" class="mono text-sm font-bold"></p>
      </div>
      <div class="bg-white/5 border border-white/5 rounded-xl p-3 text-center">
        <p class="text-[9px] mono tracking-wider text-white/40 mb-1">BTC/USD</p>
        <p id="statBtc" class="mono text-sm font-bold"></p>
      </div>
      <div class="bg-white/5 border border-white/5 rounded-xl p-3 text-center">
        <p class="text-[9px] mono tracking-wider text-white/40 mb-1">RANK</p>
        <p id="statRank" class="mono text-sm font-bold text-red-500"></p>
      </div>
    </div>

    <!-- VIRTUAL CARD -->
    <div class="bg-gradient-to-br from-neutral-800 via-neutral-900 to-black rounded-2xl p-5 border border-white/10 mb-4">
      <div class="flex items-center justify-between mb-6">
        <span id="cardTier" class="text-[10px] mono tracking-[0.25em] text-white/40"></span>
        <div class="w-7 h-5 rounded-sm bg-gradient-to-br from-yellow-200/80 to-yellow-500/60"></div>
      </div>
      <p class="mono text-base tracking-[0.12em] mb-5 text-white/90 whitespace-nowrap">**** **** **** <span id="cardLast4"></span></p>
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <div class="w-6 h-6 rounded-full bg-red-500/90"></div>
          <div class="w-6 h-6 rounded-full bg-orange-300/90 -ml-3 mix-blend-screen"></div>
        </div>
        <button class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>
    </div>

    <!-- ADD ACCOUNT LINK -->
    <div class="flex justify-center">
      <button class="text-[13px] font-semibold text-white/70 underline underline-offset-4 decoration-white/30 hover:text-white transition-colors">
        Add Account
      </button>
    </div>
  </div>

  <!-- ======================= TRANSACTIONS (LIGHT) ======================= -->
  <div class="px-6 pt-7 relative z-10">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-black text-neutral-900 tracking-tight">Transaction</h2>
      <span class="text-[13px] font-semibold text-neutral-400 underline underline-offset-4 cursor-pointer hover:text-neutral-600">See All</span>
    </div>

    <div class="space-y-2.5" id="historyList">
      <!-- items injected by JS -->
    </div>

    <div class="flex justify-center mt-7">
      <button id="resetBtn" class="text-[10px] mono text-neutral-300 hover:text-neutral-500 tracking-[0.25em] uppercase transition-colors">
        ↺ Reset demo
      </button>
    </div>
  </div>

  <!-- ======================= FLOATING BOTTOM NAV ======================= -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 w-[calc(100%-3rem)] max-w-[19rem]">
    <div class="bg-[#121212] rounded-full flex items-center justify-around py-3.5 px-8 shadow-[0_15px_30px_-10px_rgba(0,0,0,0.5)]">
      <button class="text-white hover:text-red-500 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      </button>
      <button class="text-white/40 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
      <button class="text-white/40 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  // ---------- SPLASH SCREEN ----------
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.classList.add('fade-out');
      setTimeout(() => splash.remove(), 500);
    }, 2400);
  });

  // ---------- CURRENCY FORMAT ----------
  function formatCurrency(num) {
    const n = parseFloat(num);
    if (isNaN(n)) return '$0.00';
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function parseCurrencyInput(str) {
    const cleaned = str.replace(/[^0-9.\-]/g, '');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  function placeCaretAtEnd(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function selectAllContent(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // ---------- GENERIC EDITABLE FIELD (contenteditable + localStorage) ----------
  function makeEditable(el, storageKey, defaultVal, opts = {}) {
    let current = localStorage.getItem(storageKey);
    if (current === null || current === '') current = defaultVal;
    el.textContent = current;
    el.setAttribute('contenteditable', 'true');

    if (opts.digitsOnly || opts.maxLength) {
      el.addEventListener('input', () => {
        let text = el.textContent;
        if (opts.digitsOnly) text = text.replace(/[^0-9]/g, '');
        if (opts.maxLength) text = text.slice(0, opts.maxLength);
        if (text !== el.textContent) {
          el.textContent = text;
          placeCaretAtEnd(el);
        }
      });
    }

    el.addEventListener('focus', () => selectAllContent(el));

    el.addEventListener('blur', () => {
      let val = el.textContent.trim();
      if (!val) val = defaultVal;
      if (opts.transform) val = opts.transform(val);
      el.textContent = val;
      current = val;
      localStorage.setItem(storageKey, val);
      if (opts.onCommit) opts.onCommit(val);
    });

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  }

  // ---------- BALANCE (editable + localStorage) ----------
  const balanceWrap = document.getElementById('balanceWrap');
  const STORAGE_BALANCE = 'bol_balance';
  const STORAGE_HIDDEN = 'bol_balance_hidden';
  let currentBalance = parseFloat(localStorage.getItem(STORAGE_BALANCE)) || 126300;
  let isHidden = localStorage.getItem(STORAGE_HIDDEN) === 'true';

  function renderBalance() {
    const el = document.getElementById('balanceDisplay');
    if (!el) return;
    el.textContent = isHidden ? '$•••••••••' : formatCurrency(currentBalance);
  }
  renderBalance();

  balanceWrap.addEventListener('click', () => {
    if (document.getElementById('balanceInput')) return;
    if (isHidden) return;

    const input = document.createElement('input');
    input.id = 'balanceInput';
    input.type = 'text';
    input.setAttribute('inputmode', 'decimal');
    input.value = currentBalance.toFixed(2);
    input.className = 'mono text-[2.75rem] leading-none font-black tracking-tight bg-transparent border-b-2 border-red-600 text-center w-56';
    balanceWrap.innerHTML = '';
    balanceWrap.appendChild(input);
    input.focus();
    input.select();

    function commit() {
      const val = parseCurrencyInput(input.value);
      currentBalance = val;
      localStorage.setItem(STORAGE_BALANCE, currentBalance);
      balanceWrap.innerHTML = '<span id="balanceDisplay" class="mono text-[2.75rem] leading-none font-black tracking-tight"></span>';
      renderBalance();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  });

  // ---------- EYE TOGGLE ----------
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');
  const toggleEyeBtn = document.getElementById('toggleEye');

  function renderEye() {
    if (isHidden) {
      eyeOpen.classList.add('hidden');
      eyeClosed.classList.remove('hidden');
    } else {
      eyeOpen.classList.remove('hidden');
      eyeClosed.classList.add('hidden');
    }
  }
  renderEye();

  toggleEyeBtn.addEventListener('click', () => {
    isHidden = !isHidden;
    localStorage.setItem(STORAGE_HIDDEN, isHidden);
    renderEye();
    renderBalance();
  });

  // ---------- WALLET TITLE (editable + localStorage) ----------
  const STORAGE_USER = 'bol_username';
  let currentUser = localStorage.getItem(STORAGE_USER) || 'Your Wallet';

  function attachUserListener(el) {
    el.textContent = currentUser;
    el.addEventListener('click', () => {
      if (document.getElementById('userInput')) return;
      const input = document.createElement('input');
      input.id = 'userInput';
      input.type = 'text';
      input.value = currentUser;
      input.maxLength = 24;
      input.className = 'text-[15px] font-bold tracking-tight bg-transparent border-b border-red-600 outline-none w-32 text-center';
      el.replaceWith(input);
      input.focus();
      input.select();

      function commit() {
        const val = input.value.trim() || 'Your Wallet';
        currentUser = val;
        localStorage.setItem(STORAGE_USER, currentUser);
        const span = document.createElement('p');
        span.id = 'userDisplay';
        span.className = 'text-[15px] font-bold tracking-tight cursor-text';
        input.replaceWith(span);
        attachUserListener(span);
      }
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      });
    });
  }
  attachUserListener(document.getElementById('userDisplay'));

  // ---------- LOGO / BANK NAME (editable) ----------
  makeEditable(document.getElementById('logoDisplay'), 'bol_logo', 'BL', {
    maxLength: 3,
    transform: v => v.toUpperCase(),
    onCommit: v => { document.getElementById('pushLogo').textContent = v; }
  });
  document.getElementById('pushLogo').textContent = localStorage.getItem('bol_logo') || 'BL';

  // ---------- CARD TIER (editable) ----------
  makeEditable(document.getElementById('cardTier'), 'bol_card_tier', 'WHALE ELITE', {
    maxLength: 22,
    transform: v => v.toUpperCase()
  });

  // ---------- CARD LAST 4 DIGITS (editable) ----------
  makeEditable(document.getElementById('cardLast4'), 'bol_card_last4', '2030', {
    digitsOnly: true,
    maxLength: 4,
    transform: v => v.padStart(4, '0')
  });

  // ---------- STATS (editable) ----------
  makeEditable(document.getElementById('statApy'), 'bol_stat_apy', '412%', { maxLength: 8 });
  makeEditable(document.getElementById('statBtc'), 'bol_stat_btc', '98.4K', { maxLength: 8 });
  makeEditable(document.getElementById('statRank'), 'bol_stat_rank', '#01', { maxLength: 6 });

  // ---------- FULLSCREEN TOGGLE ----------
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const expandIcon = document.getElementById('expandIcon');
  const compressIcon = document.getElementById('compressIcon');

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    const isFull = !!document.fullscreenElement;
    expandIcon.classList.toggle('hidden', isFull);
    compressIcon.classList.toggle('hidden', !isFull);
  });

  // ---------- FAKE PUSH NOTIFICATION ----------
  const pushNotif = document.getElementById('pushNotif');
  const pushMsg = document.getElementById('pushMsg');
  let pushTimeout;

  function triggerPushNotification(msg) {
    pushMsg.textContent = msg || 'Nuevo ingreso recibido';
    pushNotif.classList.remove('opacity-0', '-translate-y-16', 'pointer-events-none');
    pushNotif.classList.add('opacity-100', 'translate-y-0');
    clearTimeout(pushTimeout);
    pushTimeout = setTimeout(() => {
      pushNotif.classList.add('opacity-0', '-translate-y-16', 'pointer-events-none');
      pushNotif.classList.remove('opacity-100', 'translate-y-0');
    }, 3200);
  }

  document.getElementById('notifBtn').addEventListener('click', () => {
    triggerPushNotification(`+${formatCurrency(currentBalance)} disponible en tu cuenta`);
  });

  // ---------- TRANSACTIONS (editable name/amount + localStorage) ----------
  const STORAGE_TXN = 'bol_transactions';
  const historyList = document.getElementById('historyList');

  const defaultTransactions = [
    { id: 't1', name: 'Transfer from Binance Desk', sub: 'Today · 09:14', amount: 842000, color: 'bg-red-500' },
    { id: 't2', name: 'Transfer from Sarah James', sub: 'Today · 03:47', amount: 300, color: 'bg-blue-400' },
    { id: 't3', name: 'Transfer from Tether Treasury', sub: 'Yesterday · 22:03', amount: 1250, color: 'bg-emerald-400' },
    { id: 't4', name: 'Transfer from Goldman Prime', sub: 'Yesterday · 14:20', amount: 96.75, color: 'bg-amber-400' },
  ];

  function loadTransactions() {
    try {
      const raw = localStorage.getItem(STORAGE_TXN);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaultTransactions));
  }

  let transactions = loadTransactions();
  function saveTransactions() {
    localStorage.setItem(STORAGE_TXN, JSON.stringify(transactions));
  }

  function renderTransactions() {
    historyList.innerHTML = transactions.map((item, idx) => `
      <div class="flex items-center justify-between px-4 py-3.5 rounded-2xl ${idx === 0 ? 'bg-[#121212] text-white' : 'bg-gray-100 text-neutral-900'}">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-10 h-10 shrink-0 rounded-full ${item.color} flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 11l5-5m0 0l5 5m-5-5v12" />
            </svg>
          </div>
          <div class="min-w-0">
            <p class="txn-name text-[13px] font-bold truncate" contenteditable="true" data-id="${item.id}">${item.name}</p>
            <p class="text-[11px] ${idx === 0 ? 'text-white/40' : 'text-neutral-400'} mono">${item.sub}</p>
          </div>
        </div>
        <p class="txn-amount mono text-[13px] font-bold shrink-0 ml-2" contenteditable="true" data-id="${item.id}">+${formatCurrency(item.amount)}</p>
      </div>
    `).join('');
    attachTxnListeners();
  }

  function attachTxnListeners() {
    document.querySelectorAll('.txn-name').forEach(el => {
      el.addEventListener('focus', () => selectAllContent(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
      el.addEventListener('blur', () => {
        const txn = transactions.find(t => t.id === el.dataset.id);
        if (!txn) return;
        const val = el.textContent.trim() || txn.name;
        txn.name = val;
        el.textContent = val;
        saveTransactions();
      });
    });

    document.querySelectorAll('.txn-amount').forEach(el => {
      el.addEventListener('focus', () => selectAllContent(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
      el.addEventListener('blur', () => {
        const txn = transactions.find(t => t.id === el.dataset.id);
        if (!txn) return;
        const val = parseCurrencyInput(el.textContent);
        txn.amount = val;
        el.textContent = '+' + formatCurrency(val);
        saveTransactions();
      });
    });
  }

  renderTransactions();

  // ---------- ADD FAKE TRANSACTION (show button) ----------
  const fakeCompanies = [
    'Binance OTC Desk', 'Coinbase Prime', 'Goldman Sachs Wire', 'Kraken Institutional',
    'Tether Treasury', 'JPMorgan Private Bank', 'BlackRock Fund', 'Circle Reserve',
    'Fidelity Digital', 'Robinhood Crypto'
  ];
  const fakeColors = ['bg-red-500', 'bg-blue-400', 'bg-emerald-400', 'bg-amber-400', 'bg-purple-400', 'bg-pink-400', 'bg-cyan-400'];

  document.getElementById('addTxnBtn').addEventListener('click', () => {
    const name = 'Transfer from ' + fakeCompanies[Math.floor(Math.random() * fakeCompanies.length)];
    const amount = Math.round((Math.random() * 480000 + 20000) * 100) / 100;
    const now = new Date();
    const newTxn = {
      id: 't' + Date.now(),
      name,
      sub: 'Ahora · ' + now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }),
      amount,
      color: fakeColors[Math.floor(Math.random() * fakeColors.length)]
    };
    transactions.unshift(newTxn);
    saveTransactions();
    renderTransactions();

    if (!isHidden) {
      currentBalance += amount;
      localStorage.setItem(STORAGE_BALANCE, currentBalance);
      renderBalance();
    }

    if (navigator.vibrate) navigator.vibrate(35);
    triggerPushNotification(`+${formatCurrency(amount)} acreditado`);
  });

  // ---------- RESET DEMO ----------
  document.getElementById('resetBtn').addEventListener('click', () => {
    const keys = [
      'bol_balance', 'bol_balance_hidden', 'bol_username', 'bol_logo',
      'bol_card_tier', 'bol_card_last4', 'bol_stat_apy', 'bol_stat_btc',
      'bol_stat_rank', 'bol_transactions'
    ];
    keys.forEach(k => localStorage.removeItem(k));
    location.reload();
  });
</script>

</body>
</html>
